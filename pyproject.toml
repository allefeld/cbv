[project]
name = "cbv"
version = "0.1.0"
description = "A clutter-free comic book viewer"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Carsten Allefeld", email = "allefeld@users.noreply.github.com" }
]
requires-python = ">=3.11,<3.15"
dependencies = [
    "pillow>=12.3.0",
    "py7zr>=1.1.3",
    "pyqt6>=6.11.0",
    "unrar2-cffi>=0.5.0",
]

[project.scripts]
cbv = "cbv.__main__:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
